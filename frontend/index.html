<!-- index.html -->
<!doctype html>
<html>
    <head>
        <title>Server Monitor</title>
        <link rel="stylesheet" href="style.css" />
        <script src="app.js" type="module" defer></script>
    </head>
    <body>
        <header>
            <h1 class="title">Server Monitor</h1>
            <h1>тут будет Хидер</h1>
        </header>
        <main>
            <div class="container">
                <div class="stats">
                    <div class="stat">
                        <h1 id="tempLabel">Temp: Загрузка...</h1>
                        <button id="temp">Обновить температуру</button>
                    </div>
                    <div class="stat">
                        <h1 id="payload">Load: Загрузка...</h1>
                        <button id="load">Обновить нагрузку</button>
                    </div>
                    <div class="stat">
                        <h1 id="memory">Mem: загрузка...</h1>
                        <button id="refresh">Обновить RAM</button>
                    </div>
                    <div class="stat">
                        <h1 id="storage">Storage: Загрузка...</h1>
                        <button id="temp">Обновить хранилище</button>
                    </div>
                </div>
                <div class="graph">
                    <h1>graph</h1>
                </div>
            </div>
        </main>
        <footer><h1>тут будет Футер</h1></footer>
    </body>
</html>
