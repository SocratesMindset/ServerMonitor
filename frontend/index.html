<!-- index.html -->
<!doctype html>
<html>
    <head>
        <title>Server Monitor</title>
        <link rel="stylesheet" href="style.css" />
        <script src="app.js" defer></script>
    </head>
    <body>
        <header><h1>Хидер</h1></header>
        <main>
            <h1 class="title">Server Monitor</h1>
            <div class="stats">
                <div class="stat">
                    <h1 id="cpu">CPU: загрузка...</h1>
                    <button id="refresh">Обновить загрузку CPU</button>
                </div>
                <div class="stat">
                    <h1 id="templb">Temp: Загрузка</h1>
                    <button id="temp">Обновить температуру</button>
                </div>
            </div>
        </main>
        <footer><h1>Футер</h1></footer>
    </body>
</html>
